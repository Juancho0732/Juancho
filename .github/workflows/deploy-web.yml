name: Deploy web demo to GitHub Pages

on:
  push:
    branches:
      - claude/plan-discovery-app-design-66ea6r
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Export static web build
        env:
          # Anon key pública por diseño (protegida por RLS en Supabase, no es
          # un secreto) -- mismo valor embebido en el APK de Android.
          EXPO_PUBLIC_SUPABASE_URL: https://nqkrhcyqjrbehztnpfts.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xa3JoY3lxanJiZWh6dG5wZnRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MjM5NTYsImV4cCI6MjEwMjA5OTk1Nn0.N4NQbJYYWcJeURWk5wO0RuKmvNG3Yxb0QYNqsAbeTV0
          EXPO_WEB_BASE_URL: /Juancho
        run: npx expo export --platform web

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
